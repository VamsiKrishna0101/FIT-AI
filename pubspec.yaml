name: fitai_mobile
description: "FitAI Pro-Grade AI Fitness & Biometric Intelligence Engine"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.20.3
  flutter_timezone: ^5.1.1
  video_player: ^2.8.2
  cupertino_icons: ^1.0.8
  path_drawing: ^1.0.1

  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.3
  health: ^13.3.1
  image_picker: ^1.1.2
  liquid_glass_native: 0.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  app_settings: ^9.0.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_android: ^0.5.4
  liquid_glass_renderer:
    path: packages/liquid_glass_renderer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/branding/
    - assets/onboarding_images/
    - assets/anatomy/LICENSE
