name: setcraft
description: "Setcraft Pro-Grade AI Fitness & Biometric Intelligence Engine"
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.20.3
  flutter_timezone: ^5.1.1
  video_player: ^2.8.2
  cupertino_icons: ^1.0.8
  path_drawing: ^1.0.1

  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.3
  health: ^13.3.1
  image_picker: ^1.1.2
  liquid_glass_native: 0.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  app_settings: ^9.0.0
  purchases_flutter: ^10.0.0
  purchases_ui_flutter: ^10.0.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_android: ^0.5.4
  in_app_purchase_storekit: ^0.4.13+2
  liquid_glass_renderer:
    path: packages/liquid_glass_renderer
  firebase_auth: ">=6.0.0 <7.0.0"
  google_sign_in: 7.2.0
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  shaders:
    - shaders/water_optics.frag
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    # Rep, the coach, speaks in Nunito (SIL OFL, see Nunito-OFL.txt).
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Nunito-OFL.txt
    # Explicit entries keep the retired welcome video out of new app bundles.
    - assets/branding/google_g_logo.png
    - assets/branding/LUCIDE_LICENSE
    - assets/branding/setcraft-hero-cinematic.jpg
    - assets/branding/setcraft-icon.png
    - assets/branding/setcraft-mark.svg
    - assets/branding/setcraft-premium-strength-v1.png
    - assets/branding/setcraft-training-hero-v1.png
    - assets/branding/setcraft-welcome-training-v2.png
    - assets/branding/trial-bin.png
    - assets/onboarding_images/
    - assets/onboarding_bodies/
    - assets/exercise_anatomy/
    - assets/anatomy/LICENSE
