name: Build iOS IPA (TestMu AI / Cloud Testing)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend Base URL (ngrok)'
        required: false
        default: 'https://4ac5-2401-4900-1c27-feeb-8a9-4f63-4c4d-14d5.ngrok-free.app'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # device_info_plus 12.4 requires headers from the iOS 26.1 SDK or newer.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          pod --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Dependencies
        run: |
          if [ -d "mobile" ] && [ -f "mobile/pubspec.yaml" ]; then
            cd mobile
          fi
          flutter pub get --enforce-lockfile

      - name: Build iOS Application (Release, No Codesign)
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://4ac5-2401-4900-1c27-feeb-8a9-4f63-4c4d-14d5.ngrok-free.app' }}
        run: |
          if [ -d "mobile" ] && [ -f "mobile/pubspec.yaml" ]; then
            cd mobile
          fi
          echo "Building iOS with backend URL: $BACKEND_URL"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "ngrok-skip-browser-warning: true" -H "Accept: application/json" \
            "${BACKEND_URL%/}/health" | python3 -c 'import json, sys; health = json.load(sys.stdin); assert health.get("status") == "ok", "Backend health check failed"; print("Backend health check passed")'
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=SETCRAFT_API_BASE_URL="$BACKEND_URL" \
            --dart-define=FITAI_API_BASE_URL="$BACKEND_URL" \
            --dart-define=REVENUECAT_IOS_KEY="appl_JeWpuFoZFkyUzLKctzvLubqjHYi" \
            --dart-define=SETCRAFT_APPLE_SIGN_IN=true

      - name: Package Unsigned IPA for Cloud Testing
        run: |
          if [ -d "mobile" ] && [ -f "mobile/pubspec.yaml" ]; then
            cd mobile
          fi
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload "$GITHUB_WORKSPACE/output"
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -q -r -y "$GITHUB_WORKSPACE/output/Setcraft-Runner.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/output/Setcraft-Runner.ipa" | tail -n 1
          ls -lh "$GITHUB_WORKSPACE/output/Setcraft-Runner.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: setcraft-ios-ipa
          path: output/Setcraft-Runner.ipa
          if-no-files-found: error
          retention-days: 14
