name: Deploy to TestFlight (Internal Testing)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy-testflight.yml'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend Base URL'
        required: false
        default: 'https://api.setcraft.fit'

jobs:
  deploy-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          pod --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Dependencies
        run: |
          if [ -d "mobile" ] && [ -f "mobile/pubspec.yaml" ]; then
            cd mobile
          fi
          flutter pub get --enforce-lockfile

      - name: Ensure SQLite Native Assets
        run: |
          mkdir -p "$RUNNER_TEMP/sqlite_cache"
          echo "Copying bundled SQLite native library..."
          
          if [ -f "libsqlite3.arm64.ios.dylib" ]; then
            cp "libsqlite3.arm64.ios.dylib" "$RUNNER_TEMP/sqlite_cache/libsqlite3.arm64.ios.dylib"
          elif [ -f "ios/native_assets/libsqlite3.arm64.ios.dylib" ]; then
            cp "ios/native_assets/libsqlite3.arm64.ios.dylib" "$RUNNER_TEMP/sqlite_cache/libsqlite3.arm64.ios.dylib"
          fi
          
          EXPECTED_HASH="f1bc69a4304a21e472c15f849c34ae46539483cfa7ce901f54175c6d6cc17991"
          ACTUAL_HASH=$(shasum -a 256 "$RUNNER_TEMP/sqlite_cache/libsqlite3.arm64.ios.dylib" | awk '{print $1}')
          echo "Bundled file hash: $ACTUAL_HASH"
          echo "Expected hash:     $EXPECTED_HASH"
          
          if [ "$ACTUAL_HASH" = "$EXPECTED_HASH" ]; then
            echo "Hash verified successfully. Starting local mirror HTTP server on port 8089..."
            python3 -m http.server 8089 --directory "$RUNNER_TEMP/sqlite_cache" &
            sleep 2
            find "$PUB_CACHE/hosted/pub.dev" -name "description.dart" -exec sed -i '' \
              's|https://github.com/simolus3/sqlite3.dart/releases/download/\$RELEASE_TAG/\$FILENAME|http://127.0.0.1:8089/\$FILENAME|g' {} +
            echo "Successfully patched sqlite3 build hook to use local mirror."
          else
            echo "Error: Bundled hash mismatch!"
            exit 1
          fi

      - name: Configure Code Signing & Keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          WATCH_PP_PATH=$RUNNER_TEMP/watch_pp.mobileprovision

          # The embedded Apple Watch app (com.setcraft.app.watchkitapp) needs its own
          # App Store provisioning profile with the HealthKit capability.
          if [ -z "$WATCH_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::Missing secret WATCH_PROVISIONING_PROFILE_BASE64 (App Store profile for com.setcraft.app.watchkitapp). See docs/apple-watch.md."
            exit 1
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          # Decode certificate and provisioning profile
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          echo "$WATCH_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$WATCH_PP_PATH"
          WATCH_PROFILE_NAME=$(security cms -D -i "$WATCH_PP_PATH" | plutil -extract Name raw -)
          echo "Watch provisioning profile: $WATCH_PROFILE_NAME"
          echo "WATCH_PROFILE_NAME=$WATCH_PROFILE_NAME" >> "$GITHUB_ENV"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import distribution certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          cp "$WATCH_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Installed provisioning profiles successfully."

          # Force Xcode project to Manual signing with Apple Distribution identity
          APP_DIR="."
          if [ -d "mobile/ios" ]; then
            APP_DIR="mobile"
          fi
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$APP_DIR/ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/"iPhone Developer"/"Apple Distribution"/g' "$APP_DIR/ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$APP_DIR/ios/Runner.xcodeproj/project.pbxproj"
          # Watch target does not use Release.xcconfig: give it its own identity/profile.
          WATCH_PROFILE_NAME="$WATCH_PROFILE_NAME" perl -0pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = com\.setcraft\.app\.watchkitapp;)/$1\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{WATCH_PROFILE_NAME}";/g' "$APP_DIR/ios/Runner.xcodeproj/project.pbxproj"
          grep -c "PROVISIONING_PROFILE_SPECIFIER = \"$WATCH_PROFILE_NAME\"" "$APP_DIR/ios/Runner.xcodeproj/project.pbxproj"
          
          # Append configuration overrides to Release.xcconfig
          xcconfig="$APP_DIR/ios/Flutter/Release.xcconfig"
          echo "" >> "$xcconfig"
          echo "CODE_SIGN_STYLE = Manual" >> "$xcconfig"
          echo "CODE_SIGN_IDENTITY = Apple Distribution" >> "$xcconfig"
          echo "DEVELOPMENT_TEAM = 7WZXCCWWHM" >> "$xcconfig"
          echo "PROVISIONING_PROFILE_SPECIFIER = Setcraft AppStore Distribution" >> "$xcconfig"

      - name: Generate ExportOptions.plist
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>7WZXCCWWHM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.setcraft.app</key>
              <string>Setcraft AppStore Distribution</string>
              <key>com.setcraft.app.watchkitapp</key>
              <string>${WATCH_PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          cat $RUNNER_TEMP/ExportOptions.plist

      - name: Build Signed iOS IPA
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://api.setcraft.fit' }}
        run: |
          APP_DIR="."
          if [ -d "mobile/ios" ]; then
            APP_DIR="mobile"
          fi
          cd "$APP_DIR"
          
          # Build signed IPA using custom ExportOptions
          BUILD_NUM=${{ github.run_number }}
          flutter build ipa --release \
            --build-name="1.0.0" \
            --build-number="$BUILD_NUM" \
            --dart-define="BACKEND_BASE_URL=$BACKEND_URL" \
            --export-options-plist=$RUNNER_TEMP/ExportOptions.plist \
            -v

          # Verify output artifact
          ls -la build/ios/ipa/*.ipa

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setcraft-Runner-ipa
          path: '**/build/ios/ipa/*.ipa'
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA to TestFlight (App Store Connect)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Save private key for altool
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          # Find generated IPA
          IPA_PATH=$(find . -name "*.ipa" -type f | head -n 1)
          echo "Found IPA at: $IPA_PATH"

          # Upload via xcrun altool
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

      - name: Clean Up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
