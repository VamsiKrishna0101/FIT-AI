name: Deploy to TestFlight (Internal Testing)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy-testflight.yml'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend Base URL (ngrok / API)'
        required: false
        default: 'https://27dc-2401-4900-889d-5b4b-dd79-e94c-4489-b65b.ngrok-free.app'

jobs:
  deploy-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          pod --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Dependencies
        run: |
          if [ -d "mobile" ] && [ -f "mobile/pubspec.yaml" ]; then
            cd mobile
          fi
          flutter pub get --enforce-lockfile

      - name: Configure Code Signing & Keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          
          # Decode certificate and provisioning profile
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import distribution certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Install provisioning profile (UUID and name)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/e51cc713-08e6-475e-a107-946e8b0ba29a.mobileprovision
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/Setcraft_AppStore_Distribution.mobileprovision
          echo "Installed provisioning profiles successfully."

          # Configure Manual Signing for CI Release
          for pbx in ios/Runner.xcodeproj/project.pbxproj mobile/ios/Runner.xcodeproj/project.pbxproj; do
            if [ -f "$pbx" ]; then
              sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$pbx"
              sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "Apple Distribution"/g' "$pbx"
              echo "Updated $pbx to Manual Apple Distribution signing."
            fi
          done

          for xcconfig in ios/Flutter/Release.xcconfig mobile/ios/Flutter/Release.xcconfig; do
            if [ -f "$xcconfig" ]; then
              echo "CODE_SIGN_STYLE = Manual" >> "$xcconfig"
              echo "CODE_SIGN_IDENTITY = Apple Distribution" >> "$xcconfig"
              echo "PROVISIONING_PROFILE_SPECIFIER = Setcraft AppStore Distribution" >> "$xcconfig"
              echo "DEVELOPMENT_TEAM = 7WZXCCWWHM" >> "$xcconfig"
              echo "Updated $xcconfig."
            fi
          done

      - name: Generate ExportOptions.plist
        run: |
          EXPORT_DIR="ios"
          if [ -d "mobile/ios" ]; then
            EXPORT_DIR="mobile/ios"
          fi
          mkdir -p "$EXPORT_DIR"
          cat << 'EOF' > "$EXPORT_DIR/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>7WZXCCWWHM</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.setcraft.app</key>
                  <string>Setcraft AppStore Distribution</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          echo "ExportOptions.plist created at $EXPORT_DIR/ExportOptions.plist"

      - name: Build Signed iOS IPA
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://27dc-2401-4900-889d-5b4b-dd79-e94c-4489-b65b.ngrok-free.app' }}
        run: |
          if [ -d "mobile" ] && [ -f "mobile/pubspec.yaml" ]; then
            cd mobile
          fi
          echo "Building iOS with backend URL: $BACKEND_URL"
          for attempt in 1 2 3 4 5; do
            echo "Checking backend health (attempt $attempt/5)..."
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              -H "ngrok-skip-browser-warning: true" -H "Accept: application/json" \
              "${BACKEND_URL%/}/health" 2>/dev/null | grep -q '"status":"ok"'; then
              echo "Backend health check passed!"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Warning: Backend health check did not pass, proceeding with build..."
            else
              sleep 3
            fi
          done

          BUILD_NUMBER=${{ github.run_number }}
          echo "Using build number: $BUILD_NUMBER"

          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=SETCRAFT_API_BASE_URL="$BACKEND_URL" \
            --dart-define=FITAI_API_BASE_URL="$BACKEND_URL" \
            --dart-define=REVENUECAT_IOS_KEY="appl_JeWpuFoZFkyUzLKctzvLubqjHYi" \
            --dart-define=SETCRAFT_APPLE_SIGN_IN=true

          find . -name "*.ipa" -ls

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: setcraft-signed-testflight-ipa
          path: "**/build/ios/ipa/*.ipa"
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA to TestFlight (App Store Connect)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.private_keys/

          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: No IPA file found to upload!"
            exit 1
          fi
          echo "Uploading $IPA_PATH to TestFlight..."

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

          echo "Upload to TestFlight completed successfully!"

      - name: Clean Up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
